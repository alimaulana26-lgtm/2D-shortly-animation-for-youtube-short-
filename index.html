<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SHORTLY — 2D Explainer Starter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage" aria-label="Demo animasi SHORTLY">
    <div class="sky">
      <div class="sun"></div>
      <div class="cloud cloud-a"></div><div class="cloud cloud-b"></div>
      <div class="shop">
        <div class="awning">TOKO MINI</div>
        <div class="shop-window"><span>🥤</span><span>🥛</span><span>🧃</span></div>
      </div>
      <div class="ground"></div>
      <div class="price-card"><small>HARGA AIR MINERAL</small><strong>Rp4.000</strong></div>
      <div class="character" id="character">
        <div class="shadow"></div>
        <div class="head">
          <div class="eyes"><i></i><i></i></div>
          <div class="mouth" id="mouth"></div>
          <div class="cheek left"></div><div class="cheek right"></div>
        </div>
        <div class="body"></div>
        <div class="arm arm-left"></div><div class="arm arm-right"></div>
        <div class="leg leg-left"></div><div class="leg leg-right"></div>
      </div>
      <div class="speech" id="speech">Wah, murah juga!</div>
      <div class="caption" id="caption">Kenapa harga barang bisa berbeda?</div>
    </div>
    <div class="controls">
      <button id="play">▶ Putar animasi</button>
      <button id="reset">↺ Ulangi</button>
      <span>Demo SHORTLY • 2D Explainer</span>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
