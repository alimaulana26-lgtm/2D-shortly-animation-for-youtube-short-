        <div class="room" id="toko" aria-label="Ilustrasi ruangan dengan pintu">
          <div class="room-picture"><span>✦</span></div>
          <div class="door-frame">
            <div class="door">
              <span class="door-panel door-panel-top"></span>
              <span class="door-panel door-panel-bottom"></span>
              <span class="door-knob"></span>
            </div>
          </div>
          <div class="door-glow"></div>
        </div>
        <div class="ground"></div>
        <div class="price-card" id="kartu"><small id="kartu-label">FENOMENA INGATAN</small><strong id="kartu-harga">DOORWAY EFFECT</strong></div>

        <!-- Maskot SHORTLY: gambar pose/ekspresi diganti oleh script.js sesuai scenes.js -->
        <div class="character" id="character" data-pose="berdiri">
          <div class="aura"></div>
          <div class="shadow"></div>
          <!-- Tubuh 3 lapis dari gambar pose yang sama (kaki, badan, kepala) supaya bisa digerakkan terpisah -->
          <div class="tubuh" id="tubuh"><div class="balik">
            <img class="lap kaki" src="assets/pose-berdiri.webp" width="460" height="840" draggable="false" alt="">
            <img class="lap badan" src="assets/pose-berdiri.webp" width="460" height="840" draggable="false" alt="">
            <img class="lap kepala" src="assets/pose-berdiri.webp" width="460" height="840" draggable="false"
                 alt="SHORTLY, maskot laki-laki berhoodie hitam berlogo S">
          </div></div>
          <!-- Close-up wajah (dipakai saat kamera 'wajah') -->
          <img class="bust" src="assets/wajah-senang.webp" width="460" height="540" draggable="false" alt="">
          <div class="ikon" id="ikon" aria-hidden="true"></div>
          <div class="speech" id="speech">Wah, murah juga!</div>
        </div>
      </div>

      <!-- Lapisan di atas kamera: logo, subtitle, transisi -->
      <div class="logo">
        <strong>SHORTLY</strong>
        <small>Belajar • Tahu • Jadi Pintar</small>
      </div>
      <div class="caption" id="caption">Kenapa harga barang bisa berbeda?</div>
      <div class="fade" id="fade"></div>
      <div class="flash" id="flash"></div>
    </div>
    <div class="controls">
      <button id="play">▶ Putar animasi</button>
      <button id="reset">↺ Ulangi</button>
      <span>Demo SHORTLY • 2D Cinematic Explainer</span>
    </div>
  </main>
  <script src="scenes.js"></script>
  <script src="script.js"></script>
</body>
</html>
